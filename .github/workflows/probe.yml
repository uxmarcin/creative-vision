name: Probe zrodel leadow
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: |
          curl -s -m 30 -G "https://ezamowienia.gov.pl/mo-board/api/v1/notice" --data-urlencode "NoticeNumber=2026/BZP 00536306/01" --data-urlencode "PageSize=2" > a.json; python3 -c "
          import json,re;d=json.load(open('a.json'));print('n',len(d));
          import html as H
          if d:
            t=re.sub(r'<style.*?</style>','',d[0]['htmlBody'],flags=re.S);t=H.unescape(re.sub(r'<[^>]+>',' ',t));t=re.sub(r'\s+',' ',t);print(len(t));print(t[:3500])"
          echo; echo == TED; curl -s -m 30 -L "https://ted.europa.eu/pl/notice/756646-2026/html" > t.html; wc -c t.html; python3 -c "
          import re,html as H;t=open('t.html',encoding='utf8',errors='ignore').read();t=re.sub(r'<(script|style).*?</\1>','',t,flags=re.S);t=H.unescape(re.sub(r'<[^>]+>',' ',t));t=re.sub(r'\s+',' ',t);i=t.find('Nabywca');print(t[i:i+1500] if i>=0 else t[:1500]);print(re.findall(r'[\w.+-]+@[\w-]+\.[\w.]+',t)[:5])"
