name: Probe zrodel leadow
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: |
          u="https://ezamowienia.gov.pl/mo-board/api/v1/notice?NoticeType=ContractNotice&PublicationDateFrom=2026-10-20T00:00:00&PublicationDateTo=2026-11-19T23:59:59&CpvCode=72413000-8&PageSize=50&PageNumber=1"
          curl -s -m 30 "$u" > a.json; python3 -c "
          import json;d=json.load(open('a.json'));print(len(d));print([k for k in d[0].keys()] if d else '');
          [print(x['noticeNumber'],x.get('objectId'),x['organizationProvince'],x['organizationCity'],x['orderObject'][:90],x['cpvCode'][:60],x['submittingOffersDate']) for x in d[:15]]"
          curl -s -m 30 "https://ezamowienia.gov.pl/mo-board/api/v1/notice?NoticeType=ContractNotice&PublicationDateFrom=2026-10-20T00:00:00&PublicationDateTo=2026-11-19T23:59:59&CpvCode=72413000-8&OrganizationProvince=PL18&PageSize=50" > b.json; python3 -c "import json;d=json.load(open('b.json'));print('prov',len(d),set(x['organizationProvince'] for x in d))"
          curl -s -m 30 "https://ezamowienia.gov.pl/mo-board/api/v1/notice?NoticeType=ContractNotice&PublicationDateFrom=2026-11-18T00:00:00&PublicationDateTo=2026-11-19T23:59:59&PageSize=10" > c.json; python3 -c "import json;d=json.load(open('c.json'));print('all',len(d))"
