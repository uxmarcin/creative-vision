name: Panel faktur, przypomnienia

# W dni robocze rano uruchamia wysyłkę przypomnień i wezwań do zapłaty.
# Skrypt jest idempotentny: każdy rodzaj wiadomości trafia do faktury najwyżej raz.

on:
  schedule:
    - cron: '7 7 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 120 https://creative-vision.pl/panel/cron.php
