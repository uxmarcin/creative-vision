name: probe-bk
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL https://bazakonkurencyjnosci.funduszeeuropejskie.gov.pl/assets/index-D3ELI812.js -o a.js
          python3 -c "
          import re
          s=open('a.js').read()
          for k in ['fetchApi=','fetchApi(ci','function fetchApi(','X-Requested','Accept-Language','credentials:']:
              for m in list(re.finditer(re.escape(k),s))[:2]: print('##',k); print(s[max(0,m.start()-200):m.start()+900].replace(chr(10),' '))
          "
