name: probe-bk
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://bazakonkurencyjnosci.funduszeeuropejskie.gov.pl/api/announcements/search
          for q in "page=1&limit=3&sort=default" "page=1&limit=3&sort=publicationDate" "page=1&limit=3&sort=submissionDeadline" "page=1&limit=3&sort=publicationDate&query=strona%20internetowa" "page=1&limit=3&sort=0" "page=1&limit=3"; do echo "== $q"; curl -sS "$B?$q" | head -c 2500; echo; done
