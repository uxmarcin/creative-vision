name: probe-bk
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://bazakonkurencyjnosci.funduszeeuropejskie.gov.pl
          curl -sSL $B/assets/index-D3ELI812.js -o a.js
          python3 - <<'P'
          import re
          s=open('a.js').read()
          for k in ['announcements/search','/api/announcements"']:
            for m in list(re.finditer(re.escape(k),s))[:3]:
              print('##',k); print(s[max(0,m.start()-700):m.start()+500].replace('\n',' '))
          P
          echo; echo "=== POST"
          curl -sS -X POST -H 'Content-Type: application/json' -d '{"page":1,"limit":3}' "$B/api/announcements/search" | head -c 1500; echo
          curl -sS "$B/api/announcements/search?page=1&limit=3&sort=-publication_date" | head -c 800; echo
          curl -sS "$B/api/announcements?page=1&limit=3" | head -c 800; echo
