name: probe-bk
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://bazakonkurencyjnosci.funduszeeuropejskie.gov.pl/api/announcements/search
          H='Content-type: application/json; charset=utf-8'
          for q in "page=1&limit=3&sort=publicationDate" "page=1&limit=3&sort=default&query=strona%20internetowa" "page=1&limit=2&sort=publicationDate&query=sklep%20internetowy&status[0]=PUBLISHED"; do echo "== $q"; curl -sS -H "$H" "$B?$q" | head -c 3500; echo; done
