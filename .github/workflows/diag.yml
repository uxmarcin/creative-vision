name: Sprawdzenie panelu faktur
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kody odpowiedzi
        run: |
          for u in panel panel/ panel/data/ panel/data/index.html panel/data/panel.sqlite panel/lib/boot.php panel/lib/setup-hash.php panel/vendor/dompdf/VERSION panel/fonts/Jost-400.ttf panel/assets/panel.css panel/cron.php f/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa probe-5e112c68767bc552.php; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' https://creative-vision.pl/$u) $u"
          done
          curl -s https://creative-vision.pl/panel | grep -o '<h1>[^<]*' || true
          curl -s https://creative-vision.pl/panel/cron.php; echo
          curl -sI https://creative-vision.pl/panel | grep -i -E 'content-security|x-robots|set-cookie' || true
