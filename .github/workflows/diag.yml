name: Sprawdzenie poczty (DNS)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Serwer poczty
        run: |
          echo "MX:"; dig +short MX creative-vision.pl
          for h in mail.creative-vision.pl creative-vision.pl; do echo "$h A: $(dig +short A $h | tr '\n' ' ')"; done
          for mx in $(dig +short MX creative-vision.pl | awk '{print $2}'); do echo "$mx A: $(dig +short A $mx | tr '\n' ' ')"; done
          for h in $(dig +short MX creative-vision.pl | awk '{print $2}' | sed 's/\.$//') mail.creative-vision.pl; do
            for p in 993 465; do
              echo "== $h:$p"; timeout 8 openssl s_client -connect $h:$p -servername $h </dev/null 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null | head -4 || echo "brak"
            done
          done
          echo "SPF:"; dig +short TXT creative-vision.pl
