name: Sprawdzenie panelu
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panel
        run: |
          for u in panel "panel?a=quotes" "panel?a=books" panel/cron.php panel/lib/books.php panel/data/costs/ panel/.user.ini; do echo "$(curl -s -o /dev/null -w '%{http_code}' "https://creative-vision.pl/$u") $u"; done
          curl -s https://creative-vision.pl/panel | grep -o '<h1>[^<]*' || true
