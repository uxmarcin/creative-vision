name: Diagnostyka serwera
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag.yml"]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Katalogi na serwerze
        env: { S: "${{ secrets.FTP_SERVER }}", U: "${{ secrets.FTP_USERNAME }}", P: "${{ secrets.FTP_PASSWORD }}" }
        run: |
          sudo apt-get install -y lftp >/dev/null 2>&1
          { echo '```'; lftp -c "set ftp:ssl-force true; set ssl:verify-certificate no; set net:max-retries 1; set net:timeout 20; set net:reconnect-interval-base 2; open -u \"$U\",\"$P\" $S; echo '[/]'; cls -1; echo '[public_html]'; ls -la public_html/; echo '[private_html]'; ls -la private_html; echo '[public_html/*]'; cls -1 public_html/*/" 2>&1 | sed "s/$U/<login>/g"; echo '```'; } >> $GITHUB_STEP_SUMMARY
