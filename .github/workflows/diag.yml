name: Sprawdzenie DNS i strony
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag.yml"]
jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS i odpowiedź serwera
        run: |
          {
          echo '## DNS'; echo '```'
          for d in uxaudyt.pl www.uxaudyt.pl creative-vision.pl www.creative-vision.pl; do
            for r in ns1.cyberfolks.pl 1.1.1.1 8.8.8.8; do echo "$d @$r: $(dig +short $d A @$r | tr '\n' ' ') (TTL $(dig +noall +answer $d A @$r | awk 'NR==1{print $2}'))"; done
          done
          echo '```'; echo '## Co odpowiada pod prawdziwym adresem'; echo '```'
          for u in http://uxaudyt.pl/ https://www.uxaudyt.pl/ http://creative-vision.pl/ https://creative-vision.pl/; do
            echo "$u -> $(curl -sk -o /tmp/b -w '%{http_code} %{remote_ip} %{redirect_url}' $u) | $(grep -o '<meta name="generator"[^>]*' /tmp/b | head -1)"
          done
          echo '```'
          } >> $GITHUB_STEP_SUMMARY
