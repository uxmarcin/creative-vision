name: Ilustracje artykułów
on:
  push:
    branches: [img/art-ai]
jobs:
  img:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y webp
          B=https://www.figma.com/api/mcp/asset
          while read slug id; do
            curl -fsSL -o /tmp/$slug.png "$B/$id.png"
            cwebp -quiet -q 80 -resize 1200 0 /tmp/$slug.png -o public/img/art-$slug.webp
          done <<'L'
ile-kosztuje-sklep-internetowy cc0230b6-b696-4c05-8ac9-90e565687e7f
strona-firmowa-ktora-zbiera-zapytania 79000086-b7e6-4330-9b44-eed69fb37f79
ile-kosztuje-strona-internetowa 42e70b23-9e8e-4d8e-a95d-a7c0ca32e1bd
ux-karty-produktu cc8e2e4a-6fc9-4e24-a679-5708a59853f4
ui-a-ux-roznice 2e6f3851-8971-4bd3-a992-202a4d60a873
ai-w-sklepie-internetowym 8e042245-0838-4468-afcd-105db1d8dbbf
sklep-a-zakupy-przez-asystentow-ai 1a982221-4f64-4ceb-9042-5507d7aceb5c
co-to-jest-prestashop c928ab16-82bb-47a6-8dea-d3e70b858909
moduly-prestashop b431ad0b-5f5e-4d80-8f3d-e406c6c25167
projektowanie-ux-ui e2b0eded-e14c-4863-8d8c-63edb514c7c3
jak-stworzyc-strone-internetowa 0c0e391a-f0db-4116-b1b7-357619c5cc0c
cennik 628572b3-fc4c-4dd3-a91d-1840cb7d2d56
jak-wybrac-agencje-e-commerce de764795-5472-4fb3-a308-0ded89d6cbf0
jak-zalozyc-sklep-internetowy 481de69f-3571-4a91-9099-d4e7012e4fee
ile-kosztuje-aplikacja-mobilna bd0640fd-2ae3-42bb-a67a-237d32033ea3
jaka-platforma-sklepu-internetowego 1a7ef5d4-8596-4967-8c92-bab6c7ec4a10
L
          ls -la public/img/art-*
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git rm -q .github/workflows/art-img.yml
          git add public/img/art-*.webp
          git commit -m "Ilustracje AI do artykułów (WebP 1200 px)"
          git push
