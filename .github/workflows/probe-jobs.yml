name: probe-jobs
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          for u in "https://useme.com/pl/jobs/" "https://useme.com/pl/jobs/rss/" "https://useme.com/pl/jobs/category/programowanie-i-it,35/" "https://www.oferia.pl/zlecenia/strony-internetowe" "https://www.oferia.pl/zlecenia" "https://freelancehunt.com/pl/projects" "https://www.freelancer.com/api/projects/0.1/projects/active/?query=website&limit=5&full_description=true" "https://www.useme.com/pl/feed/jobs/" "https://zlecenia.przez.net/" "https://www.fixly.pl/kategoria/strony-internetowe" "https://justjoin.it/api/offers"; do
            echo "=================== $u"
            curl -sSL -A "$UA" -o /tmp/o -w "%{http_code} %{size_download} %{url_effective}\n" "$u" || true
            head -c 600 /tmp/o | tr -s '\n' ' '; echo
            grep -oE 'href="[^"]*(jobs|zlecenie|zlecenia|project)[^"]*"' /tmp/o | sort -u | head -25
            grep -oiE '<link[^>]+rss[^>]*>' /tmp/o | head
          done
