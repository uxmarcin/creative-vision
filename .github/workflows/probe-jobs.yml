name: probe-jobs
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          mkdir out
          curl -sSL -A "$UA" "https://useme.com/pl/jobs/category/serwisy-internetowe,34/strony-internetowe,96/" -o out/list.html
          curl -sSL -A "$UA" "https://useme.com/pl/jobs/category/programowanie-i-it,35/aplikacje-webowe,102/?page=2" -o out/list2.html
          u=$(grep -oE '/pl/jobs/[a-z0-9-]+,[0-9]+/' out/list.html | head -1); curl -sSL -A "$UA" "https://useme.com$u" -o out/job.html
          curl -sS "https://www.freelancer.com/api/projects/0.1/projects/active/?query=website%20design&limit=10&full_description=true&min_price=500&job_details=true" -o out/fl.json
          curl -sS -A "CreativeVisionAudit/1.0" -o /dev/null -w "plainUA %{http_code}\n" "https://useme.com/pl/jobs/"
      - uses: actions/upload-artifact@v4
        with: {name: out, path: out}
