name: figup
on:
  push:
    branches: [img/figup]
permissions:
  contents: write
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install pillow numpy >/dev/null 2>&1; mkdir -p gg5
          while read n k u; do curl -sS -f -L -o /tmp/f.png "$u" && python3 - "$n" "$k" <<'PY' && echo "ok $n" || echo "FAIL $n"
          import sys
          from PIL import Image
          Image.MAX_IMAGE_PIXELS=None
          n,k=sys.argv[1],sys.argv[2]
          im=Image.open('/tmp/f.png').convert('RGB')
          import numpy as np
          W,H=(2880,1800) if k=='d' else (1170,2532)
          im=im.resize((W,round(im.height*W/im.width)),Image.LANCZOS)
          if im.height>H:
              a=np.asarray(im.convert('L')).astype(int)
              flat=(a.max(axis=1)-a.min(axis=1))<6
              cut=H; run=0
              for y in range(H-1,int(H*0.8),-1):
                  run=run+1 if flat[y] else 0
                  if run>=28: cut=y+run//2; break
              im=im.crop((0,0,W,cut))
          if im.height<H:
              c=Image.new('RGB',(W,H),im.getpixel((W//2,im.height-1)));c.paste(im,(0,0));im=c
          im.save('gg5/'+n+'.webp',quality=95,method=6)
          print(n,im.size)
          PY
          done < tools/gg5.txt
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add gg5 && git commit -m "gg5 figma exports [skip ci]" && git push
