name: figup
on:
  push:
    branches: [img/figup]
permissions:
  contents: write
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install pillow numpy >/dev/null 2>&1; mkdir -p gg5
          while read n k u; do curl -sS -f -L -o /tmp/f.png "$u" && python3 - "$n" "$k" <<'PY' && echo "ok $n" || echo "FAIL $n"
          import sys
          from PIL import Image
          Image.MAX_IMAGE_PIXELS=None
          n,k=sys.argv[1],sys.argv[2]
          im=Image.open('/tmp/f.png').convert('RGB')
          import numpy as np
          a=np.asarray(im).astype(int)
          if k=='d': im=im.crop((96,154,1304,im.height))
          else: im=im.crop((0,106,im.width,im.height))
          a=np.asarray(im).astype(int); bg=a[-1,im.width//2]
          rows=np.where((np.abs(a-bg).sum(axis=2)>12).any(axis=1))[0]
          im=im.crop((0,0,im.width,int(rows[-1])+1+ (24 if k=='d' else 0)))
          W=1208 if k=='d' else 750
          im=im.resize((W,round(im.height*W/im.width)),Image.LANCZOS)
          im.save('gg5/'+n+'.webp',quality=86,method=6)
          print(n,im.size)
          PY
          done < tools/gg5.txt
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add gg5 && git commit -m "gg5 figma exports [skip ci]" && git push
