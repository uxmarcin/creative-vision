name: figup
on:
  push:
    branches: [img/figup]
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://creative-vision.pl/ https://www.creative-vision.pl/; do
            echo "== $u"; curl -sS -D /tmp/h -o /tmp/b "$u?nocache=$RANDOM"; grep -iE "^(HTTP|cache-control|cf-|x-cache|age|server|last-modified|x-litespeed)" /tmp/h
            for k in cvgr cv-cta2-ph of3-tg "Marzysz o sklepie" greview cv-of-sklepy2 of3smoke; do printf "%s: %s\n" "$k" "$(grep -c -- "$k" /tmp/b)"; done
            grep -o '/js/cv-[A-Z0-9]*\.js' /tmp/b | head -1
          done
          curl -sS -D - -o /dev/null https://creative-vision.pl/ | grep -iE "cache|age|litespeed|server"
