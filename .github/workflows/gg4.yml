name: gg4
on:
  push:
    branches: [img/gg4]
jobs:
  dl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install pillow
          B=https://www.figma.com/api/mcp/asset
          while read slug id w; do
            curl -fsSL -o /tmp/$slug.png "$B/$id.png"
            python3 -c "
          from PIL import Image
          Image.MAX_IMAGE_PIXELS=None
          im=Image.open('/tmp/$slug.png').convert('RGB');print('$slug',im.size)
          Image.MAX_IMAGE_PIXELS=None
          r=900/1440 if $w>2000 else 844/390
          b=(im.size[0]-(5760 if $w>2000 else 1560))//2
          W=im.size[0]-2*b
          im=im.crop((b,b,b+W,b+min(im.size[1]-2*b,round(W*r))))
          w=$w;h=round(im.size[1]*w/im.size[0]);im=im.resize((w,h),Image.LANCZOS)
          im.save('public/img/gg4-$slug.webp','WEBP',quality=90,method=6)"
          done <<'L'
          m-menu 5af47596-7bc3-4a4d-9e0a-86eaef5dbe42 1170
          m-szukaj c7a0a805-352f-4fc3-b6e6-81363dbbfdff 1170
          m-listing 00aaafd4-bc6e-483d-a18d-be78a9579dff 1170
          m-filtry 08536f16-52f0-4e80-b9c1-14eef9115df0 1170
          m-koszyk 1e355a9b-c882-4683-949c-5ff2f101b3c5 1170
          m-paczkomat 97ea5f8f-be51-41f6-8429-95760373a45d 1170
          m-potwierdzenie 6ac29333-0771-40c8-a340-cb0f99fc99a1 1170
          L
          ls -la public/img/gg4-*
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add public/img/gg4-m-*.webp && git commit -m "GoldenGun: ekrany x4" && git push
