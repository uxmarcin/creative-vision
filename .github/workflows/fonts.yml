name: Pobranie fontów (jednorazowo)
on:
  push:
    branches: [main]
    paths: [".github/workflows/fonts.yml"]
jobs:
  f:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Satoshi (Fontshare) + IBM Plex Mono (Google)
        run: |
          mkdir -p public/fonts && cd public/fonts
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sSL -A "$UA" "https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" -o satoshi.src.css
          curl -sSL -A "$UA" "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" -o plex.src.css
          cat satoshi.src.css plex.src.css | grep -oE 'url\([^)]+\)' | sed -E "s/url\(['\"]?//; s/['\"]?\)$//" | sed -E 's#^//#https://#' | sort -u > urls.txt
          cat urls.txt
          while read -r u; do curl -sSL "$u" -o "$(echo "$u" | sed -E 's#https?://##; s#[/?=&]#_#g')"; done < urls.txt
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/fonts && git commit -qm "Fonty Satoshi i IBM Plex Mono (lokalnie)" && git push
